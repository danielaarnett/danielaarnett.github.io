# GitHub Pages serves the homepage and explicitly published free chapters.
# The private Flask application runs on a separate host.
exclude:
  - app
  - config.py
  - run.py
  - requirements.txt
  - tests
  - pytest.ini
  - migrations
  - instance
  - private_content
  - .venv
  - .env
  - .env.example
  - local-qa
  - README.md
  - DESIGN.md
