name: Library checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, dom
          tools: composer:v2
          coverage: none
      - run: composer install --working-dir=php-app --no-dev --prefer-dist --no-interaction
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check migrations and an empty installation
        run: |
          flask --app run db upgrade
          flask --app run seed-catalog
          flask --app run db check
